<app-mobile-profile
  [name]="auth.session()?.name || 'Field Worker'"
  role="OMECO Field Worker"
  [email]="auth.session()?.email || ''"
  [rows]="rows"
  [notifications]="notifications()"
  [darkMode]="theme.mode() === 'dark'"
  [message]="message()"
  (notificationsChange)="notifications.set($event)"
  (darkModeChange)="setDarkMode($event)"
  (save)="save()"
  (logout)="signOut()"
/>
