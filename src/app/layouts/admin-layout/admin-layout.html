<div class="admin-shell">
  <aside class="sidebar" [class.open]="menuOpen()">
    <a class="brand" routerLink="/admin/dashboard"
      ><span class="brand-mark"><app-icon name="bolt-circle" [size]="39" /></span
      ><span>OMECO<small>Concern intelligence</small></span></a
    >
    @for (section of sections; track section) {
      <nav>
        <h2>{{ section.title }}</h2>
        @for (item of section.links; track item) {
          <a [routerLink]="item.path" routerLinkActive="active" (click)="menuOpen.set(false)"
            ><span><app-icon [name]="item.icon" /></span>{{ item.label }}</a
          >
        }
      </nav>
    }
    <div class="sidebar-footer">
      <span class="avatar">{{ auth.session()?.name?.slice(0, 1) }}</span>
      <div>
        <strong>{{ auth.session()?.name }}</strong
        ><small>Dispatcher</small>
      </div>
      <button type="button" aria-label="Sign out" (click)="signOut()">
        <app-icon name="log-out" />
      </button>
    </div>
  </aside>
  <div class="main-area">
    <header class="topbar">
      <button
        class="menu-toggle"
        type="button"
        aria-label="Toggle navigation"
        (click)="menuOpen.update((v) => !v)"
      >
        <app-icon name="menu" />
      </button>
      <a class="workspace-search" routerLink="/admin/complaints"
        ><app-icon name="search" [size]="18" /><span>Search concerns, members, areas...</span></a
      >
      <div class="tools">
        <button class="theme-toggle" type="button" (click)="theme.toggle()">
          <app-icon [name]="theme.mode() === 'dark' ? 'sun' : 'moon'" />
          {{ theme.mode() === 'dark' ? 'Light' : 'Dark' }}</button
        ><app-notification-center /><span class="online"><i></i> Systems operational</span>
      </div>
    </header>
    <main><router-outlet /></main>
  </div>
</div>
