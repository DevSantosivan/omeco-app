@if (loading) {
  <div class="state" role="status">
    <div class="skeleton"></div>
    <p>Loading connected demo records…</p>
  </div>
} @else if (error) {
  <div class="state" role="alert">
    <app-icon name="error" [size]="32" />
    <h2>Data unavailable</h2>
    <p>{{ error }}</p>
    <button type="button" (click)="retry.emit()">Restore demo data</button>
  </div>
} @else if (empty) {
  <div class="state">
    <app-icon name="search" [size]="32" />
    <h2>No matching records</h2>
    <p>Adjust the filters to see available demo data.</p>
  </div>
} @else {
  <ng-content />
}
